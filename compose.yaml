x-app: &app
  build: .
  image: relay-dispatcher:local
  env_file: .env
  environment: &app-environment
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_CHANNEL: stderr
    APP_URL: http://localhost:8088
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: notification_dispatcher
    DB_USERNAME: dispatcher
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    QUEUE_CONNECTION: redis
    REDIS_QUEUE_RETRY_AFTER: 120
    SESSION_DRIVER: database
    CACHE_STORE: database
    DISPATCH_ALLOW_LOCAL_TARGETS: "false"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
services:
  app:
    <<: *app
  listener:
    <<: *app
    command: ["php", "artisan", "dispatch:listen"]
  workers:
    <<: *app
    command: ["php", "artisan", "dispatch:workers"]
    stop_grace_period: 60s
  web:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    restart: unless-stopped
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: notification_dispatcher
      MYSQL_USER: dispatcher
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  mysql-data:
  redis-data:
